name: Feature request
description: An idea for OpenGrokBot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How do you imagine it working?
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I'd like to build this myself
