name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider of the employee involved
      options: [Claude (subscription), Claude (API key), Codex CLI, Gemini CLI, OpenAI-compatible API, Not provider related]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: Windows 11, Node 24.16
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server output
      description: The lines printed by `npm run desktop` / `npm start` around the time of the bug.
      render: shell
